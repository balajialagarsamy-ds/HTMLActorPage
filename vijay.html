<p>
  Chandrasekaran Joseph Vijay (born 22 June 1974) is an Indian politician and former actor. He is the founder and president of the political party Tamilaga Vettri Kazhagam (TVK). Prior to entering politics, he was one of the leading actors in Tamil cinema.
